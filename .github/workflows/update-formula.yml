name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to (e.g., 0.2.2)'
        required: true
      prerelease:
        description: 'Is this a prerelease?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.client_payload.version }}"
          fi
          # Strip 'v' prefix if present
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Detect pre-release and set formula
        id: formula
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            IS_PRERELEASE="${{ github.event.client_payload.prerelease }}"
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            FORMULA="proton-drive-sync-prerelease.rb"
          else
            FORMULA="proton-drive-sync.rb"
          fi

          echo "formula=$FORMULA" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Updating formula: $FORMULA (pre-release: $IS_PRERELEASE)"

      - name: Download and calculate SHA256
        id: sha256
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Download darwin-arm64
          curl -sL "https://github.com/DamianB-BitFlipper/proton-drive-sync/releases/download/v${VERSION}/proton-drive-sync-darwin-arm64.tar.gz" -o darwin-arm64.tar.gz
          SHA_MAC_ARM=$(shasum -a 256 darwin-arm64.tar.gz | cut -d' ' -f1)
          echo "sha_mac_arm=$SHA_MAC_ARM" >> $GITHUB_OUTPUT

          # Download darwin-x64
          curl -sL "https://github.com/DamianB-BitFlipper/proton-drive-sync/releases/download/v${VERSION}/proton-drive-sync-darwin-x64.tar.gz" -o darwin-x64.tar.gz
          SHA_MAC_INTEL=$(shasum -a 256 darwin-x64.tar.gz | cut -d' ' -f1)
          echo "sha_mac_intel=$SHA_MAC_INTEL" >> $GITHUB_OUTPUT

          # Download linux-arm64
          curl -sL "https://github.com/DamianB-BitFlipper/proton-drive-sync/releases/download/v${VERSION}/proton-drive-sync-linux-arm64.tar.gz" -o linux-arm64.tar.gz
          SHA_LINUX_ARM=$(shasum -a 256 linux-arm64.tar.gz | cut -d' ' -f1)
          echo "sha_linux_arm=$SHA_LINUX_ARM" >> $GITHUB_OUTPUT

          # Download linux-x64
          curl -sL "https://github.com/DamianB-BitFlipper/proton-drive-sync/releases/download/v${VERSION}/proton-drive-sync-linux-x64.tar.gz" -o linux-x64.tar.gz
          SHA_LINUX_INTEL=$(shasum -a 256 linux-x64.tar.gz | cut -d' ' -f1)
          echo "sha_linux_intel=$SHA_LINUX_INTEL" >> $GITHUB_OUTPUT

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA_MAC_ARM="${{ steps.sha256.outputs.sha_mac_arm }}"
          SHA_MAC_INTEL="${{ steps.sha256.outputs.sha_mac_intel }}"
          SHA_LINUX_ARM="${{ steps.sha256.outputs.sha_linux_arm }}"
          SHA_LINUX_INTEL="${{ steps.sha256.outputs.sha_linux_intel }}"
          FORMULA="Formula/${{ steps.formula.outputs.formula }}"

          # Update version
          sed -i "s/version \".*\"/version \"$VERSION\"/" "$FORMULA"

          # Update SHA256 for each platform using comment markers
          sed -i 's/.*# MAC_ARM_SHA256$/      sha256 "'"$SHA_MAC_ARM"'" # MAC_ARM_SHA256/' "$FORMULA"
          sed -i 's/.*# MAC_INTEL_SHA256$/      sha256 "'"$SHA_MAC_INTEL"'" # MAC_INTEL_SHA256/' "$FORMULA"
          sed -i 's/.*# LINUX_ARM_SHA256$/      sha256 "'"$SHA_LINUX_ARM"'" # LINUX_ARM_SHA256/' "$FORMULA"
          sed -i 's/.*# LINUX_INTEL_SHA256$/      sha256 "'"$SHA_LINUX_INTEL"'" # LINUX_INTEL_SHA256/' "$FORMULA"

      - name: Commit and push
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FORMULA="${{ steps.formula.outputs.formula }}"
          IS_PRERELEASE="${{ steps.formula.outputs.is_prerelease }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/$FORMULA"

          if [ "$IS_PRERELEASE" = "true" ]; then
            git commit -m "Update proton-drive-sync-rc to v${VERSION}"
          else
            git commit -m "Update proton-drive-sync to v${VERSION}"
          fi

          git push
